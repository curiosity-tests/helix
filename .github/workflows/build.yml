          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  docs:
    name: Grammar Lint
    runs-on: ubuntu-latest
    if: github.repository == 'helix-editor/helix' || 'push' != 'schedule'
    steps:
    - name: Checkout sources
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - uses: ./.github/actions/rust-setup
      with:
        toolchain: ${{ env.MSRV }}
        cache-key: build
        cache-grammars: 'true'
        grammar-cache-version: ${{ env.GRAMMAR_CACHE_VERSION }}

    - name: Validate queries
      if: always()
      run: cargo xtask query-check

    - name: Validate indents
      if: always()
      run: cargo xtask indent-check

    - name: Validate highlights
      if: always()
      run: cargo xtask highlight-check

    - name: Validate themes
      if: always()
      run: cargo xtask theme-check

    - name: Generate docs
      if: always()
      run: cargo xtask docgen

    - name: Check uncommitted documentation changes
      if: always()
      run: |
        git diff
        git diff-files --quiet \
          || (echo "Run 'cargo xtask docgen', commit the changes and push again" \
          && exit 1)
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
